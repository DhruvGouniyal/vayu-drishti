[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vayu-drishti"
version = "0.1.0"
description = "AI early-warning system for Chandigarh air quality - data ingestion"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "pyarrow>=14",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "shapely>=2.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
]

[project.scripts]
vayu = "vayu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
